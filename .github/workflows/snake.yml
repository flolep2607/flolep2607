name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#1ef2f1&color_dots=#0b120d,#0d3b34,#12776b,#17bfae,#1ef2f1
            dist/snake-light.svg?color_snake=#f6050a&color_dots=#ebedf0,#c6f6f2,#7ce8df,#2ed3c4,#1ef2f1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
