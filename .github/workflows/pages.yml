name: Deploy GitHub Pages

# Temporarily unpublished. To put the site back, upload `docs` again
# (replace the stub step with path: docs).

on:
  push:
    branches:
      - master
      - cursor/improve-github-profile-b12f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Unpublished stub
        run: |
          mkdir -p _unpublished
          printf '%s\n' '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title></title></head><body></body></html>' > _unpublished/index.html

      - name: Upload stub
        uses: actions/upload-pages-artifact@v3
        with:
          path: _unpublished

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
